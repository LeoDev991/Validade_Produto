<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Acesso - Desenvolvedor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #1f2937;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1 { margin-top: 0; font-size: 30px; }
    .auth-box {
      max-width: 420px;
      margin: 0 auto 24px;
      background: #0f172a;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 20px;
    }
    .auth-box input {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #111827;
      color: #f3f4f6;
    }
    .painel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 20px 0 30px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
    }
    .card strong {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card span {
      font-size: 24px;
      font-weight: bold;
    }
    .acoes {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #22c55e; color: white; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      background: #0f172a;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #374151;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #111827;
      color: #cbd5e1;
    }
    td {
      color: #e5e7eb;
      font-size: 13px;
      word-break: break-word;
    }
    .muted { color: #9ca3af; font-size: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginBox" class="auth-box">
      <h2>Login do desenvolvedor</h2>
      <input id="githubUser" type="text" placeholder="Usuário GitHub" />
      <input id="password" type="password" placeholder="Senha" />
      <button class="btn-success" id="btnLogin">Entrar</button>
      <p id="loginStatus" class="muted"></p>
    </div>

    <div id="dashboard" class="hidden">
      <h1>Controle de Acesso</h1>
      <p class="muted">Acessos salvos em banco de dados do servidor.</p>

      <div class="painel">
        <div class="card">
          <strong>Total registado</strong>
          <span id="totalAcessos">0</span>
        </div>
        <div class="card">
          <strong>Último acesso</strong>
          <span id="ultimoAcesso">-</span>
        </div>
      </div>

      <div class="acoes">
        <button class="btn-primary" id="btnAtualizar">Atualizar</button>
        <button class="btn-danger" id="btnLimpar">Limpar registros</button>
        <button class="btn-primary" id="btnResetConsent">Resetar consentimento</button>
        <button class="btn-danger" id="btnLogout">Sair</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Data / Hora</th>
            <th>Origem</th>
            <th>URL</th>
            <th>Navegador</th>
            <th>Dispositivo</th>
          </tr>
        </thead>
        <tbody id="tabelaAcessos"></tbody>
      </table>
    </div>
  </div>

  <script>
    const loginBox = document.getElementById('loginBox');
    const dashboard = document.getElementById('dashboard');
    const loginStatus = document.getElementById('loginStatus');
    const tbody = document.getElementById('tabelaAcessos');

    function validarAmbiente() {
      if (window.location.protocol === 'file:') {
        throw new Error('Abra o painel via http://localhost:3000/dev_acessos.html. O arquivo local não consegue acessar a API do servidor.');
      }
    }

    async function requestJson(url, options = {}) {
      validarAmbiente();

      const response = await fetch(url, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || 'Erro ao processar a requisição.');
      }

      return data;
    }

    function formatarData(dataString) {
      if (!dataString) return '-';
      const data = new Date(dataString);
      return isNaN(data.getTime()) ? dataString : data.toLocaleString('pt-BR');
    }

    function atualizarResumo(acessos) {
      document.getElementById('totalAcessos').textContent = acessos.length;
      document.getElementById('ultimoAcesso').textContent = acessos[0] ? formatarData(acessos[0].created_at) : '-';
    }

    function renderTabela(acessos) {
      if (!acessos.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Nenhum acesso registrado até o momento.</td></tr>';
        atualizarResumo(acessos);
        return;
      }

      tbody.innerHTML = acessos.map((item) => `
        <tr>
          <td>${item.device_id || '-'}</td>
          <td>${formatarData(item.created_at)}</td>
          <td>${item.referrer || '-'}</td>
          <td>${item.pathname || '-'}</td>
          <td>${item.browser ? item.browser.slice(0, 120) : '-'}</td>
          <td>${item.platform || '-'}</td>
        </tr>
      `).join('');

      atualizarResumo(acessos);
    }

    async function carregarRegistros() {
      try {
        const registros = await requestJson('/api/access-log');
        renderTabela(registros);
      } catch (error) {
        console.warn('Usando fallback local:', error);
        const fallback = JSON.parse(localStorage.getItem('validade_access_log') || '[]');
        renderTabela(fallback);
      }
    }

    async function verificarSessao() {
      try {
        const sessao = await requestJson('/api/session');
        if (sessao.authenticated) {
          loginBox.classList.add('hidden');
          dashboard.classList.remove('hidden');
          await carregarRegistros();
          return;
        }
      } catch (error) {
        console.warn('Sessão não disponível:', error);
        loginStatus.textContent = error.message;
      }

      loginBox.classList.remove('hidden');
      dashboard.classList.add('hidden');
    }

    async function login() {
      const githubUser = document.getElementById('githubUser').value.trim();
      const password = document.getElementById('password').value;

      if (!githubUser || !password) {
        loginStatus.textContent = 'Informe usuário e senha.';
        return;
      }

      try {
        await requestJson('/api/login', {
          method: 'POST',
          body: JSON.stringify({ github_user: githubUser, password })
        });

        loginStatus.textContent = '';
        await verificarSessao();
      } catch (error) {
        loginStatus.textContent = error.message;
      }
    }

    async function logout() {
      try {
        await requestJson('/api/logout', { method: 'POST' });
      } catch (error) {
        console.warn('Erro ao sair:', error);
      } finally {
        await verificarSessao();
      }
    }

    async function limparRegistros() {
      try {
        await requestJson('/api/access-log', { method: 'DELETE' });
        await carregarRegistros();
      } catch (error) {
        localStorage.removeItem('validade_access_log');
        renderTabela([]);
      }
    }

    function resetarConsentimento() {
      document.cookie = 'validade_cookie_consent=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax';
      alert('Consentimento resetado. Abra a página principal novamente para solicitar a confirmação.');
    }

    document.getElementById('btnLogin').addEventListener('click', login);
    document.getElementById('btnAtualizar').addEventListener('click', carregarRegistros);
    document.getElementById('btnLimpar').addEventListener('click', limparRegistros);
    document.getElementById('btnResetConsent').addEventListener('click', resetarConsentimento);
    document.getElementById('btnLogout').addEventListener('click', logout);

    document.getElementById('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        login();
      }
    });

    verificarSessao();
  </script>
</body>
</html>
